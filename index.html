<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { min-height: 100%; }
    body {
        min-height: 100svh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;

        color: #000000;
    }
    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* ============ 开始页样式 ============ */
    .start-page {
        min-height: calc(100svh - 40px);
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .start-page h1 { font-size: 36px; font-weight: 700; margin-bottom: 12px; line-height: 1.2; letter-spacing: 0.5px; }
    .start-page .subtitle { font-size: 16px; color: #666; margin-bottom: 20px; font-weight: 500; }
    .start-page .description { font-size: 13px; color: #999; margin-bottom: 40px; line-height: 1.6; }
    .start-button {
        width: 100%; max-width: 280px; padding: 16px;
        border: 1px solid #000; background: #000; color: #fff;
        font-size: 16px; font-weight: 600; border-radius: 0; cursor: pointer;
        transition: all 0.2s;
    }
    .start-button:hover { background: #333; border-color: #333; }
    .start-button:active { transform: scale(0.98); }
    .start-footer {
        width: 100%; margin-top: 42px; padding-top: 20px;
        border-top: 1px solid #e0e0e0; font-size: 12px; color: #999; line-height: 1.6;
    }
    .start-footer p { margin: 4px 0; }

    /* ============ 问卷页样式 ============ */

    .header p { font-size: 14px; color: #666; }
    .progress-section { margin-bottom: 30px; }
    .progress-info { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-bottom: 8px; }
    .progress-bar { height: 3px; background: #f0f0f0; border-radius: 0; overflow: hidden; }
    .progress-fill { height: 100%; background: #000; transition: width 0.5s ease-out; }
    .question-section { margin-bottom: 30px; }
    .question-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; color: #000; }
    .question-description { font-size: 14px; line-height: 1.6; color: #333; margin-bottom: 20px; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
        padding: 14px 16px; border: 1px solid #d0d0d0; background: #fafafa; cursor: pointer;
        font-size: 13px; line-height: 1.5; color: #000; border-radius: 0; transition: all 0.2s; text-align: left;
    }
    .option:hover { background: #f5f5f5; border-color: #999; }
    .option:active { background: #efefef; }
    .option.disabled { opacity: 0.5; cursor: not-allowed; }
    .option-label { font-weight: 600; display: inline-block; width: 25px; margin-right: 8px; }
    .option-text { display: inline; }

    /* ============ 结果页面样式 ============ */
    .result-container { background: #fafafa; border: 1px solid #e0e0e0; padding: 0; border-radius: 0; }
    .result-title-bar { text-align: center; padding: 20px; border-bottom: 1px solid #e0e0e0; background: #fff; }
    .result-title-bar h1 {
        font-size: 14px; font-weight: 600; color: #666; letter-spacing: 0.5px;
        text-transform: uppercase; margin-bottom: 12px;
    }
    .result-tag { font-size: 32px; font-weight: 700; margin-bottom: 8px; color: #000; }
    .result-match { font-size: 24px; font-weight: 700; color: #000; }
    .free-section { padding: 25px; background: #fff; }
    .result-item { margin-bottom: 22px; }
    .result-label { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .result-content { font-size: 13px; line-height: 1.7; color: #333; }
    .result-content.main-intro { font-size: 14px; line-height: 1.8; }
    .result-content.traits { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
    .trait-tag { display: inline-block; padding: 6px 12px; background: #f0f0f0; font-size: 12px; color: #666; border-radius: 0; }
    .buttons-section { display: flex; gap: 10px; padding: 0 25px 25px; background: #fff; border-bottom: 1px solid #e0e0e0; }
    .button {
        flex: 1; padding: 12px 16px; border: 1px solid #000; background: #000; color: #fff;
        cursor: pointer; font-size: 13px; font-weight: 600; border-radius: 0; transition: all 0.2s;
    }
    .button:hover { background: #333; border-color: #333; }
    .button.secondary { background: #fff; color: #000; border-color: #000; }
    .button.secondary:hover { background: #f5f5f5; }
    .restart-link {
        appearance: none; display: block; margin: 0 auto; padding: 8px 14px 20px;
        border: 0; background: transparent; color: #888; font-size: 12px; text-decoration: underline; cursor: pointer;
    }
    .footer-tip { text-align: center; padding: 20px; background: #fff; font-size: 12px; color: #999; }
    .footer-tip p { margin: 4px 0; }
    .share-toast {
        position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
        transform: translateX(-50%) translateY(16px); z-index: 2200;

        opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    }
    .share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
        .container { padding: 16px; }
        .start-page h1 { font-size: 32px; }
        .start-page .subtitle { font-size: 14px; }
        .header h1 { font-size: 24px; }
        .question-title { font-size: 16px; }
        .question-description { font-size: 13px; }
        .result-tag { font-size: 28px; }
        .result-match { font-size: 20px; }
    }
</style>

// ============ 计分逻辑 ============
function calculateResult(scores, lastQuestionTagWeights) {
    if (Object.keys(scores).length === 0) return null;
    const maxScore = Math.max(...Object.values(scores));
    const topTags = Object.entries(scores)
        .filter(([, score]) => score === maxScore)
        .map(([tag]) => tag);

    if (topTags.length === 1) return topTags[0];

    const lastQuestionWeights = new Map(lastQuestionTagWeights.map(t => [t.name, t.weight]));
    let maxWeight = -1;
    let bestTag = topTags[0];
    for (const tag of topTags) {
        const weight = lastQuestionWeights.get(tag) || 0;
        if (weight > maxWeight) { maxWeight = weight; bestTag = tag; }
    }
    const bestTags = topTags.filter(tag => (lastQuestionWeights.get(tag) || 0) === maxWeight);
    if (bestTags.length > 1) {
        return bestTags[Math.floor(Math.random() * bestTags.length)];
    }
    return bestTag;
}

// ============ 状态管理 ============
let appState = {
    page: 'start',
    currentQuestion: 0,
    scores: {},
    resultTag: null,
    matchPercentage: null,
    isAnimating: false,
};

function setState(updates) {
    appState = { ...appState, ...updates };
    render();
}

function startTest() {
    setState({
        page: 'question', currentQuestion: 0, scores: {},
        resultTag: null, matchPercentage: null,
    });
}

function handleSelectOption(tagWeights) {
    if (appState.isAnimating) return;
    setState({ isAnimating: true });

    const newScores = { ...appState.scores };
    tagWeights.forEach(({ name, weight }) => {
        newScores[name] = (newScores[name] || 0) + weight;
    });

    setTimeout(() => {
        if (appState.currentQuestion < QUESTIONS.length - 1) {
            setState({ currentQuestion: appState.currentQuestion + 1, scores: newScores, isAnimating: false });
        } else {
            const result = calculateResult(newScores, tagWeights);
            const matchPercentage = Math.floor(Math.random() * (99 - 82 + 1)) + 82;
            setState({ page: 'result', scores: newScores, resultTag: result, matchPercentage, isAnimating: false });
        }
    }, 300);
}

function handleRestart() {
    setState({ page: 'start', currentQuestion: 0, scores: {}, resultTag: null, matchPercentage: null });
}

let toastTimer = null;
function showToast(message) {
    const toast = document.getElementById('shareToast');
    if (!toast) return;
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

function copyTextFallback(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    textarea.setSelectionRange(0, text.length);
    const copied = document.execCommand('copy');
    textarea.remove();
    if (!copied) throw new Error('复制失败');
}

async function copyResult() {
    const text = `我是【${appState.resultTag}】，匹配度${appState.matchPercentage}%。你呢？来测试一下吧 → 看看你是什么逼`;
    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
        } else {
            copyTextFallback(text);
        }
        showToast('已复制，去发给朋友');
    } catch (error) {
        showToast('复制失败，请手动复制');
    }
}

                        <h1>看看你是什么逼</h1>
                        <div class="result-tag">${appState.resultTag}</div>
                        <div class="result-match">匹配度 ${appState.matchPercentage}%</div>
                    </div>
                    <div class="free-section">
                        <div class="result-item">
                            <div class="result-label">人物描述</div>
                            <div class="result-content main-intro">${tagData.desc}</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">核心特质</div>
                            <div class="result-content traits">
                                ${tagData.traits.map(t => `<span class="trait-tag">${t}</span>`).join('')}
                            </div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">你的优势</div>
                            <div class="result-content">${tagData.strength}</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">建议</div>
                            <div class="result-content">${tagData.advice}</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">座右铭</div>
                            <div class="result-content" style="font-weight: 600; font-size: 14px;">${tagData.slogan}</div>
                        </div>
                    </div>
                    <div class="buttons-section">
                        <button class="button" onclick="copyResult()">复制结果</button>
                        <button class="button secondary" onclick="handleRestart()">重新测试</button>
                    </div>
                </div>
                <div class="footer-tip">
                    <p>测试结果仅供娱乐</p>
                </div>
            </div>
        `;
    }
}

render();
</script>
</body>
</html>
